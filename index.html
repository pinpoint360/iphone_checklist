<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>My Checklist</title><style>
:root{color-scheme:dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f7f9ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 15% -15%,#2b3b68 0,transparent 52%),#0b1020}.app{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 30px) 20px calc(env(safe-area-inset-bottom) + 50px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:32px;letter-spacing:-1.1px;margin:6px 0 0}.eyebrow{font-size:12px;color:#a5b4fc;font-weight:800;letter-spacing:2px;text-transform:uppercase}.subtitle{color:#9ca8c2;margin:10px 0 26px}.badge{background:#28365a;border:1px solid #42557d;border-radius:18px;padding:10px 13px;font-weight:750;color:#d7e3ff;white-space:nowrap}.panel{background:#171f35;border:1px solid #303b56;border-radius:22px;padding:20px;margin-bottom:20px;box-shadow:0 12px 35px #0002}.progress-line{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#c4cde2}.progress-line strong{font-size:20px;color:white}.bar{height:9px;background:#303c57;border-radius:100px;margin-top:16px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#6b8cff,#58dbc3);border-radius:100px;transition:width .25s}.entry{display:flex;gap:10px}.entry input{flex:1;min-width:0;border:1px solid #3b4863;border-radius:13px;padding:16px;background:#0e1528;color:white;font-size:16px;outline:none}.entry input:focus{border-color:#8aa3ff}button{cursor:pointer;font:inherit}button.primary{border:0;border-radius:13px;background:#829cff;color:#091327;font-size:25px;font-weight:800;min-width:56px}.filters{display:flex;gap:8px;margin:25px 0 15px}.filter{padding:10px 17px;border:1px solid #35425c;border-radius:100px;background:#172039;color:#bbc8e2;font-size:14px}.filter.active{background:#829cff;color:#0b1428;border-color:#829cff;font-weight:800}.list{display:grid;gap:10px}.task{display:flex;align-items:center;gap:13px;background:#171f35;border:1px solid #303b56;border-radius:16px;padding:14px 13px;min-height:66px}.task label{display:flex;align-items:center;gap:13px;flex:1;min-width:0;cursor:pointer}.task input[type=checkbox]{width:23px;height:23px;accent-color:#6ddac2;flex-shrink:0}.task span{overflow-wrap:anywhere;line-height:1.35}.task.done span{text-decoration:line-through;color:#8190ae}.delete{border:0;background:transparent;color:#9faac3;font-size:22px;padding:6px 10px}.delete:focus-visible{outline:2px solid #8aa3ff}.empty{text-align:center;border:1px dashed #3c4965;border-radius:18px;padding:34px 16px;color:#aebbd5}.empty .symbol{font-size:32px;margin-bottom:8px}.foot{margin-top:26px;color:#8290aa;font-size:12px;text-align:center;line-height:1.6}.clear{margin-top:15px;background:transparent;border:0;color:#b6c4e3;text-decoration:underline;padding:10px 0} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti{position:absolute;width:6px;height:9px;border-radius:2px;animation:party-burst 850ms ease-out forwards}@keyframes party-burst{0%{transform:translate(0,0) rotate(0);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--spin));opacity:0}}@media(prefers-reduced-motion:reduce){.celebration{display:none}}

.task{flex-wrap:wrap}.task label{min-width:0}.photo-btn{border:1px solid #42557d;border-radius:11px;background:#28365a;color:#d7e3ff;padding:8px 10px;font-size:17px;line-height:1}.photo-preview{width:100%;padding-left:36px;display:flex;align-items:flex-start;gap:10px}.photo-preview img{width:100px;height:100px;object-fit:cover;border-radius:12px;border:1px solid #42557d}.photo-remove{border:1px solid #42557d;background:#28365a;color:#d7e3ff;border-radius:9px;padding:7px 9px;font-size:12px}.photo-hint{font-size:12px;color:#aebbd5}.photo-viewer{position:fixed;inset:0;z-index:50;background:#070b16ee;display:flex;align-items:center;justify-content:center;padding:22px}.photo-viewer img{max-width:100%;max-height:85dvh;object-fit:contain}.photo-viewer button{position:absolute;top:20px;right:20px;border:0;background:#28365a;color:white;border-radius:12px;padding:10px 16px;font-size:22px}
</style></head><body><main class="app"><header><div><div class="eyebrow">Your day, organised</div><h1>My Checklist ✨</h1></div><div class="badge" id="count">0 tasks</div></header><p class="subtitle">Sam’s AuDHD memory</p><section class="panel"><div class="progress-line"><span>Today's progress</span><strong id="progress">0%</strong></div><div class="bar" role="progressbar" aria-label="Checklist completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressbar"><div id="fill"></div></div></section><form class="entry" id="form"><label class="sr" for="newtask">New task</label><input id="newtask" maxlength="200" placeholder="What needs doing?" autocomplete="off" required><button class="primary" aria-label="Add task" type="submit">+</button></form><nav class="filters" aria-label="Filter tasks"><button class="filter active" data-filter="all" aria-pressed="true">All</button><button class="filter" data-filter="active" aria-pressed="false">To do</button><button class="filter" data-filter="done" aria-pressed="false">Done</button></nav><section class="list" id="list" aria-live="polite"></section><button class="clear" id="clear" hidden>Clear completed tasks</button><p class="foot">✓ Tasks save automatically on this device.</p></main><script>
(()=>{'use strict';const key='iphone-checklist-v1';let tasks=[];try{const stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))tasks=stored.filter(x=>x&&typeof x.text==='string'&&typeof x.id==='string').map(x=>({id:x.id,text:x.text,done:!!x.done}));}catch{}let filter='all';const $=id=>document.getElementById(id);function celebrate(checkbox){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const rect=checkbox.getBoundingClientRect();const layer=document.createElement('div');layer.className='celebration';layer.setAttribute('aria-hidden','true');const colors=['#6ddac2','#829cff','#ffd782','#f49fbb'];for(let i=0;i<18;i++){const piece=document.createElement('i');piece.className='confetti';piece.style.left=(rect.left+rect.width/2)+'px';piece.style.top=(rect.top+rect.height/2)+'px';piece.style.backgroundColor=colors[i%colors.length];const angle=(i/18)*Math.PI*2;const distance=40+Math.random()*65;piece.style.setProperty('--dx',Math.cos(angle)*distance+'px');piece.style.setProperty('--dy',(Math.sin(angle)*distance+35)+'px');piece.style.setProperty('--spin',(Math.random()*540-270)+'deg');layer.append(piece)}document.body.append(layer);setTimeout(()=>layer.remove(),900)}
// Photos are stored only on this device in IndexedDB, never in GitHub.
const photoDB=new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('Photo storage unavailable'));return}const request=indexedDB.open('iphone-checklist-photos',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('photos'))request.result.createObjectStore('photos')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
async function photoOperation(mode,id,value){const db=await photoDB;return new Promise((resolve,reject)=>{const tx=db.transaction('photos',mode==='get'?'readonly':'readwrite');const store=tx.objectStore('photos');const req=mode==='get'?store.get(id):mode==='put'?store.put(value,id):store.delete(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.onerror=()=>reject(tx.error)})}
function attachPhoto(row,task){const btn=document.createElement('button');btn.type='button';btn.className='photo-btn';btn.textContent='📷';btn.title='Add or change photo';btn.setAttribute('aria-label','Add or change photo for '+task.text);const picker=document.createElement('input');picker.type='file';picker.accept='image/*';picker.setAttribute('aria-label','Choose photo for '+task.text);picker.hidden=true;btn.addEventListener('click',()=>picker.click());picker.addEventListener('change',async()=>{const file=picker.files&&picker.files[0];if(!file)return;try{if(!file.type.startsWith('image/'))throw new Error('Choose an image');const bitmap=await createImageBitmap(file).catch(()=>null);let blob=file;if(bitmap){const max=1400;const ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Photo conversion failed')),'image/jpeg',0.8))}await photoOperation('put',task.id,blob);showPhoto(row,task)}catch(err){alert('Could not save photo on this device: '+err.message)}finally{picker.value=''}});row.append(btn,picker);showPhoto(row,task)}
async function showPhoto(row,task){const existing=row.querySelector('.photo-preview');if(existing)existing.remove();let blob;try{blob=await photoOperation('get',task.id)}catch{return}if(!blob||!row.isConnected)return;const url=URL.createObjectURL(blob);const area=document.createElement('div');area.className='photo-preview';const img=document.createElement('img');img.src=url;img.alt='Photo attached to '+task.text;img.addEventListener('click',()=>{const overlay=document.createElement('div');overlay.className='photo-viewer';const full=document.createElement('img');full.src=url;full.alt=img.alt;const close=document.createElement('button');close.type='button';close.textContent='×';close.setAttribute('aria-label','Close photo');close.onclick=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});overlay.append(full,close);document.body.append(overlay)});const remove=document.createElement('button');remove.type='button';remove.className='photo-remove';remove.textContent='Remove photo';remove.addEventListener('click',async()=>{if(!confirm('Remove this photo?'))return;try{await photoOperation('delete',task.id);area.remove();URL.revokeObjectURL(url)}catch{alert('Could not remove photo')}});area.append(img,remove);row.append(area);const observer=new MutationObserver(()=>{if(!row.isConnected){URL.revokeObjectURL(url);observer.disconnect()}});observer.observe(document.getElementById('list'),{childList:true})}
function save(){try{localStorage.setItem(key,JSON.stringify(tasks))}catch{alert('This browser could not save your tasks. Check private browsing or storage settings.')}}function render(){const done=tasks.filter(t=>t.done).length;const pct=tasks.length?Math.round(done/tasks.length*100):0;$('count').textContent=tasks.length+' task'+(tasks.length===1?'':'s');$('progress').textContent=pct+'%';$('fill').style.width=pct+'%';$('progressbar').setAttribute('aria-valuenow',pct);$('clear').hidden=!done;const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));$('list').replaceChildren();if(!visible.length){const empty=document.createElement('div');empty.className='empty';const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=filter==='all'?'📝':'🎉';const message=document.createElement('div');message.textContent=filter==='all'?'No tasks yet. Add your first one above!':filter==='active'?'Nothing left to do. Nice work!':'No completed tasks yet.';empty.append(symbol,message);$('list').append(empty);return;}for(const t of visible){const row=document.createElement('article');row.className='task'+(t.done?' done':'');const label=document.createElement('label');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=t.done;checkbox.setAttribute('aria-label','Mark '+t.text+' complete');checkbox.addEventListener('change',()=>{t.done=checkbox.checked;if(t.done)celebrate(checkbox);save();render()});const text=document.createElement('span');text.textContent=t.text;label.append(checkbox,text);const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='×';del.setAttribute('aria-label','Delete '+t.text);del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);photoOperation('delete',t.id).catch(()=>{});save();render()});row.append(label,del);$('list').append(row);attachPhoto(row,t)}}$('form').addEventListener('submit',e=>{e.preventDefault();const input=$('newtask');const text=input.value.trim();if(!text)return;tasks.unshift({id:typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),text,done:false});input.value='';save();render();input.focus()});document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});render()}));$('clear').addEventListener('click',()=>{if(confirm('Delete all completed tasks?')){const removed=tasks.filter(t=>t.done);tasks=tasks.filter(t=>!t.done);removed.forEach(t=>photoOperation('delete',t.id).catch(()=>{}));save();render()}});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
